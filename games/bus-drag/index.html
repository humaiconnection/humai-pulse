<!DOCTYPE html>
<html lang="en">
<head>

<title>Short Bus Showdown 32 — Sunset Speedway</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0b14;overflow:hidden;font-family:"Courier New",monospace;touch-action:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b14}
  #game{background:#000;image-rendering:pixelated;box-shadow:0 0 60px #000}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:5}
  .hidden{display:none!important}
  h1.title{font-size:clamp(28px,6vw,64px);color:#ffd23f;letter-spacing:2px;text-shadow:3px 3px 0 #b3541e,6px 6px 0 #000;margin-bottom:6px}
  .sub{color:#8a8f98;font-size:clamp(12px,2vw,18px);margin-bottom:22px;letter-spacing:3px}
  .btn{font-family:inherit;background:#1c1c2a;color:#ffd23f;border:3px solid #ffd23f;padding:12px 34px;font-size:clamp(15px,2.4vw,22px);font-weight:bold;cursor:pointer;letter-spacing:2px;margin:6px}
  .btn:hover,.btn.sel{background:#ffd23f;color:#1c1c2a}
  .btn.ghost{border-color:#555;color:#aaa}
  #racerGrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:10px}
  .racerCard{background:#151524;border:3px solid #33334a;padding:10px;width:150px;cursor:pointer}
  .racerCard img{width:100%;image-rendering:pixelated;background:#0b0b14}
  .racerCard .nm{color:#ffd23f;font-weight:bold;font-size:14px;margin-top:6px}
  .racerCard .cr{color:#8a8f98;font-size:11px}
  .racerCard.sel{border-color:#ffd23f;box-shadow:0 0 18px #ffd23f88}
  #lapRow{display:flex;gap:10px;margin:14px}
  .lapBtn{font-family:inherit;background:#151524;color:#fff;border:3px solid #33334a;padding:10px 26px;font-size:20px;font-weight:bold;cursor:pointer}
  .lapBtn.sel{border-color:#ffd23f;color:#ffd23f}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;color:#fff;font-size:clamp(13px,2vw,19px);font-weight:bold;text-shadow:2px 2px 0 #000;z-index:4;pointer-events:none}
  #boostWrap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(420px,70vw);z-index:4;pointer-events:none}
  #boostLabel{color:#ffd23f;font-size:12px;letter-spacing:2px;text-align:center;margin-bottom:4px;text-shadow:2px 2px 0 #000}
  #boostBar{height:14px;background:#22222f;border:2px solid #555}
  #boostFill{height:100%;width:100%;background:linear-gradient(90deg,#ff9d2e,#ffd23f)}
  #touchUI{position:absolute;inset:0;z-index:4;display:none;pointer-events:none}
  .tbtn{position:absolute;bottom:70px;width:84px;height:84px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-family:inherit}
  #tLeft{left:16px}#tRight{left:116px}#tGas{right:16px;background:#2e7d3222;border-color:#4caf50}#tBoost{right:116px;background:#b3541e33;border-color:#ffd23f}
  #msg{position:absolute;top:38%;width:100%;text-align:center;font-size:clamp(40px,9vw,110px);font-weight:bold;color:#ffd23f;text-shadow:4px 4px 0 #000;z-index:6;pointer-events:none;letter-spacing:4px}
  #results{background:#101018ee;border:4px solid #ffd23f;padding:26px 40px;max-width:92vw}
  #results h2{color:#ffd23f;margin-bottom:12px;letter-spacing:2px}
  #results table{margin:0 auto 16px;border-collapse:collapse;font-size:clamp(14px,2.4vw,20px)}
  #results td{padding:5px 18px;color:#ddd}
  #results td.pos{color:#ffd23f;font-weight:bold}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="hud" class="hidden">
    <div id="hudLap">LAP 1/1</div><div id="hudPos">4th</div><div id="hudSpeed">0 MPH</div>
  </div>
  <div id="boostWrap" class="hidden"><div id="boostLabel">BOOST — SHIFT / SPACE</div><div id="boostBar"><div id="boostFill"></div></div></div>
  <div id="msg" class="hidden"></div>

  <div id="touchUI">
    <div class="tbtn" id="tLeft">◀</div><div class="tbtn" id="tRight">▶</div>
    <div class="tbtn" id="tGas">▲</div><div class="tbtn" id="tBoost">⚡</div>
  </div>

  <div id="titleScreen" class="screen">
    <h1 class="title">SHORT BUS<br>SHOWDOWN 32</h1>
    <div class="sub">LEVEL 1 · SUNSET SPEEDWAY</div>
    <button class="btn" id="btnTitle">START ENGINE</button>
    <div class="sub" style="margin-top:14px;font-size:11px">ARROWS / WASD · SHIFT BOOST · v2.0</div>
  </div>

  <div id="menuScreen" class="screen hidden">
    <h1 class="title" style="font-size:clamp(22px,4vw,40px)">CHOOSE YOUR RACER</h1>
    <div id="racerGrid"></div>
    <div class="sub" style="margin:8px 0 0">LAPS</div>
    <div id="lapRow">
      <button class="lapBtn sel" data-laps="1">1</button>
      <button class="lapBtn" data-laps="2">2</button>
      <button class="lapBtn" data-laps="4">4</button>
    </div>
    <button class="btn" id="btnRace">RACE!</button>
  </div>

  <div id="resultScreen" class="screen hidden">
    <div id="results"><h2 id="resTitle">FINISH!</h2><table id="resTable"></table>
      <button class="btn" id="btnAgain">RACE AGAIN</button>
      <button class="btn ghost" id="btnChange">CHANGE RACER</button>
    </div>
  </div>
</div>
<script>
"use strict";
/* ================= SHORT BUS SHOWDOWN 32 — F-Zero-style circuit racer =================
   MAPS live in the MAPS array: add a course by pushing {name, build(), sky, palette}.
   Level select can read MAPS later; Level 1 ships now. */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=960,H=540;

/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIn=(a,b,t)=>a+(b-a)*t*t;
const easeInOut=(a,b,t)=>a+(b-a)*((-Math.cos(t*Math.PI)/2)+0.5);
function shade(hex,amt){ // amt -1..1 darken/lighten
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>=0){r+= (255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt;}
  else{r*=1+amt; g*=1+amt; b*=1+amt;}
  return `rgb(${r|0},${g|0},${b|0})`;
}

/* ---------- audio ---------- */
let AC=null, engineOsc=null, engineGain=null;
function audioInit(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engineOsc=AC.createOscillator(); engineGain=AC.createGain();
    engineOsc.type='sawtooth'; engineOsc.frequency.value=60; engineGain.gain.value=0;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    engineOsc.connect(lp); lp.connect(engineGain); engineGain.connect(AC.destination);
    engineOsc.start();
  }catch(e){}
}
function engineSound(on,rpm){
  if(!AC||!engineGain) return;
  const t=AC.currentTime;
  engineGain.gain.setTargetAtTime(on?0.05:0,t,0.1);
  if(on) engineOsc.frequency.setTargetAtTime(50+rpm*140,t,0.05);
}
function beep(freq,dur){
  if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.12,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}

/* ---------- racers ---------- */
const RACERS=[
  {id:'bus',    name:'RA TOD',      car:'Drag Bus',    top:1.00,accel:1.00,grip:1.00},
  {id:'granny', name:'Granny Gear', car:'Sunday Van',  top:0.93,accel:0.96,grip:1.06},
  {id:'dan',    name:'Diesel Dan',  car:'Rust Bucket', top:0.97,accel:1.00,grip:0.96},
  {id:'squeaky',name:'Squeaky Clean',car:'Cone Mobile',top:0.95,accel:0.99,grip:1.01},
  {id:'ted',    name:'Turbo Ted',   car:'Silverado',   top:1.03,accel:1.03,grip:0.97},
];
const DIRS=['straight','left','right'];
const SPR={}; // SPR[racerId][dir] = Image
const BG={};  // BG.dusk = Image
function loadAssets(){
  const jobs=[];
  for(const r of RACERS) for(const d of DIRS){
    jobs.push(new Promise(res=>{
      const img=new Image();
      img.onload=()=>{ (SPR[r.id]=SPR[r.id]||{})[d]=img; res(); };
      img.onerror=()=>res();
      img.src='./assets/'+r.id+'-'+d+'.png';
    }));
  }
  jobs.push(new Promise(res=>{
    const img=new Image();
    img.onload=()=>{BG.dusk=img;res();}; img.onerror=()=>res();
    img.src='./assets/bg-dusk.png';
  }));
  return Promise.all(jobs);
}

/* ---------- track builder ---------- */
const SEG_LEN=200, RUMBLE=3, DRAW_DIST=170;
const ROAD_W=2200, CAM_H=1050, FOV=100;
const CAM_DEPTH=1/Math.tan((FOV/2)*Math.PI/180);
const PLAYER_Z=CAM_H*CAM_DEPTH;
const CENTRIFUGAL=0.31;

function buildSegments(spec){
  const segs=[]; let y=0;
  function addSegment(curve,wy){
    const n=segs.length;
    segs.push({index:n,curve,
      p1:{world:{x:0,y:y,z:n*SEG_LEN},camera:{},screen:{}},
      p2:{world:{x:0,y:wy,z:(n+1)*SEG_LEN},camera:{},screen:{}},
      color:(Math.floor(n/RUMBLE)%2)?'dark':'light',looped:false,clip:0});
    y=wy;
  }
  function addRoad(enter,hold,leave,curve,dy){
    const total=enter+hold+leave;
    const y0=y, y1=y+dy*SEG_LEN;
    for(let n=0;n<enter;n++) addSegment(easeIn(0,curve,n/enter), easeInOut(y0,y1,n/total));
    for(let n=0;n<hold;n++)  addSegment(curve, easeInOut(y0,y1,(enter+n)/total));
    for(let n=0;n<leave;n++) addSegment(easeInOut(curve,0,n/leave), easeInOut(y0,y1,(enter+hold+n)/total));
  }
  spec(addRoad);
  return segs;
}

/* ---------- MAPS: add future courses here ---------- */
const MAPS=[
  { name:'Sunset Speedway', sky:'dusk',
    palette:{roadL:'#5c5c68',roadD:'#565660',rumbleL:'#e8e8e8',rumbleR:'#c93a3a',
             grassL:'#3d6b35',grassD:'#386130',lane:'#e8e8e8',horizon:'#2a1e3f'},
    build(addRoad){
      addRoad(40,40,40, 0, 0);    // start/finish straight
      addRoad(50,50,50, 2, 6);    // sweeper right
      addRoad(30,30,30, 0,-6);    // short straight
      addRoad(60,60,60,-4, 0);    // hairpin left
      addRoad(40,60,40, 0, 14);   // hill straight
      addRoad(40,40,40, 3,-7);    // S right
      addRoad(40,40,40,-3,-7);    // S left
      addRoad(50,50,50, 0, 0);    // home straight
    }},
];
</script>
<script>
"use strict";
/* ================= renderer ================= */
let segments=[], trackLength=0, MAP=null;

function project(p,cameraX,cameraY,cameraZ){
  p.camera.x=(p.world.x||0)-cameraX;
  p.camera.y=(p.world.y||0)-cameraY;
  p.camera.z=(p.world.z||0)-cameraZ;
  p.screen.scale=CAM_DEPTH/Math.max(1,p.camera.z);
  p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2);
  p.screen.y=Math.round(H/2-p.screen.scale*p.camera.y*H/2);
  p.screen.w=Math.round(p.screen.scale*ROAD_W*W/2);
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}
function fogColor(hex,f){ return shade(hex,-0.55*f); } // fade toward dark horizon

function renderSegment(seg,n){
  const pal=MAP.palette, light=seg.color==='light';
  const f=Math.pow(n/DRAW_DIST,1.6); // 0 near → 1 far
  const grass=fogColor(light?pal.grassL:pal.grassD,f);
  const road =fogColor(light?pal.roadL:pal.roadD,f);
  const rumL =fogColor(light?pal.rumbleL:pal.rumbleR,f);
  const lane =f<0.85?pal.lane:null;
  const p1=seg.p1.screen,p2=seg.p2.screen;
  // grass
  ctx.fillStyle=grass; ctx.fillRect(0,p2.y,W,p1.y-p2.y);
  // rumble strips
  const r1=p1.w/7,r2=p2.w/7;
  poly(p1.x-p1.w-r1,p1.y, p1.x-p1.w,p1.y, p2.x-p2.w,p2.y, p2.x-p2.w-r2,p2.y, rumL);
  poly(p1.x+p1.w+r1,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x+p2.w+r2,p2.y, rumL);
  // road
  poly(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x-p2.w,p2.y, road);
  // lane markers
  if(lane&&light){
    const lw1=p1.w/32,lw2=p2.w/32;
    for(let l=1;l<3;l++){
      const lx1=p1.x-p1.w+(2*p1.w*l/3), lx2=p2.x-p2.w+(2*p2.w*l/3);
      poly(lx1-lw1,p1.y,lx1+lw1,p1.y,lx2+lw2,p2.y,lx2-lw2,p2.y,lane);
    }
  }
  // start/finish line on the first light segment
  if(seg.index<RUMBLE){
    const sw1=p1.w/8,sw2=p2.w/8;
    for(let c=0;c<8;c++){
      if(c%2) continue;
      const x1=p1.x-p1.w+2*p1.w*c/8, x2=p2.x-p2.w+2*p2.w*c/8;
      poly(x1,p1.y,x1+sw1,p1.y,x2+sw2,p2.y,x2,p2.y,'#e8e8e8');
    }
  }
}

let skyX=0;
function renderBackground(playerSegment,playerY){
  const img=BG.dusk;
  const horizon=H*0.42-(playerY*0.004);
  ctx.fillStyle='#1a1030'; ctx.fillRect(0,0,W,horizon+2);
  if(img){
    const dw=W*1.4, dh=dw*img.height/img.width;
    ctx.drawImage(img,skyX,horizon-dh+2,dw,dh);
  }else{
    const g=ctx.createLinearGradient(0,0,0,horizon);
    g.addColorStop(0,'#2a1a4e'); g.addColorStop(1,'#c9522e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,horizon+2);
  }
}

function findSegment(z){ return segments[Math.floor(z/SEG_LEN)%segments.length]; }

function drawCarSprite(img,scale,destX,destY,clipY){
  if(!img) return;
  const worldW=1050; // car width in world units
  const destW=scale*worldW*W/2;
  const destH=destW*img.height/img.width;
  if(destW<2) return;
  const clipH=clipY?Math.max(0,clipY-destY+destH):0;
  const drawH=clipY?Math.min(destH,clipH):destH;
  if(drawH<=0) return;
  const srcH=img.height*(drawH/destH);
  ctx.drawImage(img,0,0,img.width,srcH,destX-destW/2,destY-destH,drawWSafe(destW),drawH);
}
function drawWSafe(w){return w;}

function renderWorld(P,cars){
  const baseSegment=findSegment(P.z);
  const basePercent=(P.z%SEG_LEN)/SEG_LEN;
  const playerSegment=findSegment(P.z+PLAYER_Z);
  const playerPercent=((P.z+PLAYER_Z)%SEG_LEN)/SEG_LEN;
  const playerY=lerp(playerSegment.p1.world.y,playerSegment.p2.world.y,playerPercent);
  renderBackground(playerSegment,playerY);
  let maxy=H, x=0, dx=-(baseSegment.curve*basePercent);
  skyX=clamp(skyX-baseSegment.curve*(P.speed/MAXS)*2.2,-W*0.4,0);
  // bucket cars by segment for the back-to-front pass
  const buckets=new Map();
  for(const c of cars){
    const si=Math.floor(c.z/SEG_LEN)%segments.length;
    if(!buckets.has(si)) buckets.set(si,[]);
    buckets.get(si).push(c);
  }
  const drawList=[];
  for(let n=0;n<DRAW_DIST;n++){
    const seg=segments[(baseSegment.index+n)%segments.length];
    seg.looped=seg.index<baseSegment.index;
    const camZ=P.z-(seg.looped?trackLength:0);
    project(seg.p1,P.x*ROAD_W-x,playerY+CAM_H,camZ);
    project(seg.p2,P.x*ROAD_W-x-dx,playerY+CAM_H,camZ);
    x+=dx; dx+=seg.curve;
    seg.clip=maxy;
    if(seg.p1.camera.z<=CAM_DEPTH||seg.p2.screen.y>=seg.p1.screen.y||seg.p2.screen.y>=maxy) continue;
    renderSegment(seg,n);
    maxy=seg.p1.screen.y;
  }
  // cars + player, far to near
  for(let n=DRAW_DIST-1;n>=0;n--){
    const seg=segments[(baseSegment.index+n)%segments.length];
    if(seg.p1.camera.z<=CAM_DEPTH) continue;
    const list=buckets.get(seg.index);
    if(list) for(const c of list){
      const s=seg.p1.screen;
      const sx=s.x+s.scale*c.offset*ROAD_W*W/2;
      const sy=s.y;
      const dir=c.lean<-0.15?'left':(c.lean>0.15?'right':'straight');
      drawCarSprite(SPR[c.id]&&SPR[c.id][dir],s.scale,sx,sy,seg.clip);
    }
  }
  return {playerY,playerSegment};
}
</script>
<script>
"use strict";
/* ================= game state ================= */
const G={mode:'title',racer:RACERS[0],laps:1,map:MAPS[0],countT:0,raceTime:0,finished:false,standings:[]};
let P=null, cars=[], skyInit=false;
const keys={};
const MAXS=12000;

function newRace(){
  MAP=G.map;
  segments=buildSegments(MAP.build);
  trackLength=segments.length*SEG_LEN;
  P={id:G.racer.id,z:0,x:0,speed:0,lap:1,totalZ:0,boost:1,boosting:false,
     top:MAXS*G.racer.top,accel:G.racer.accel,finished:false,finishTime:0,steer:0};
  cars=[];
  const others=RACERS.filter(r=>r.id!==G.racer.id);
  others.forEach((r,i)=>{
    cars.push({id:r.id,name:r.name,z:(i+1)*6000,offset:(i%2?0.5:-0.5),speed:0,
      top:MAXS*r.top*0.985,lap:1,totalZ:(i+1)*6000,lean:0,prevOffset:0,finished:false});
  });
  G.raceTime=0; G.finished=false; G.standings=[];
  G.mode='countdown'; G.countT=3.6;
  showScreen(null);
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('boostWrap').classList.remove('hidden');
  if(isTouch) document.getElementById('touchUI').style.display='block';
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(G.mode==='title'&&(e.key==='Enter'||e.key===' ')) startFromTitle();
  if((G.mode==='menu')&&e.key==='Enter') startRace();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const isTouch=('ontouchstart'in window);
function bindHold(id,down,up){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();down();}, off=e=>{e.preventDefault();up();};
  el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
const tIn={left:false,right:false,gas:false,boost:false};
bindHold('tLeft',()=>tIn.left=true,()=>tIn.left=false);
bindHold('tRight',()=>tIn.right=true,()=>tIn.right=false);
bindHold('tGas',()=>tIn.gas=true,()=>tIn.gas=false);
bindHold('tBoost',()=>tIn.boost=true,()=>tIn.boost=false);
function steerLeft(){return keys['arrowleft']||keys['a']||tIn.left;}
function steerRight(){return keys['arrowright']||keys['d']||tIn.right;}
function gasOn(){return keys['arrowup']||keys['w']||tIn.gas;}
function brakeOn(){return keys['arrowdown']||keys['s'];}
function boostOn(){return (keys['shift']||keys[' ']||tIn.boost);}

/* ---------- update ---------- */
function update(dt){
  if(G.mode==='countdown'){
    G.countT-=dt;
    const c=Math.ceil(G.countT-0.6);
    showMsg(G.countT<=0.6?'GO!':String(Math.max(1,c)));
    if(G.countT<=1.0&&G.countT+dt>1.0) beep(440,0.15);
    if(G.countT<=2.0&&G.countT+dt>2.0) beep(440,0.15);
    if(G.countT<=3.0&&G.countT+dt>3.0) beep(440,0.15);
    if(G.countT<=0){ G.mode='race'; showMsg('GO!'); beep(880,0.4); setTimeout(hideMsg,700); }
    return;
  }
  if(G.mode!=='race') return;
  G.raceTime+=dt;
  const seg=findSegment(P.z+PLAYER_Z);
  const sp=P.speed/MAXS;
  // --- player physics ---
  P.boosting=boostOn()&&P.boost>0.05&&P.speed>MAXS*0.3;
  const maxSpd=P.top*(P.boosting?1.45:1);
  if(gasOn()) P.speed+= (MAXS/4.2)*P.accel*dt;
  else if(brakeOn()) P.speed-= MAXS*1.1*dt;
  else P.speed-= MAXS*0.25*dt;
  const offroad=Math.abs(P.x)>1.15;
  if(offroad) P.speed-= P.speed*2.2*dt; // heavy drag: crawls but never fully stops with gas
  P.speed=clamp(P.speed,0,offroad?Math.min(maxSpd,MAXS*0.42):maxSpd);
  // steering
  let steer=0;
  if(steerLeft()){P.x-=2.3*dt*(0.55+0.45*sp);steer=-1;}
  if(steerRight()){P.x+=2.3*dt*(0.55+0.45*sp);steer=1;}
  P.steer=steer;
  // centrifugal push
  P.x-=dt*2.2*sp*seg.curve*CENTRIFUGAL;
  P.x=clamp(P.x,-2.4,2.4);
  P.z+=P.speed*dt; P.totalZ+=P.speed*dt;
  if(P.boosting) P.boost=Math.max(0,P.boost-0.34*dt);
  else P.boost=Math.min(1,P.boost+0.11*dt);
  // lap
  const lap=Math.floor(P.totalZ/trackLength)+1;
  if(lap>P.lap){P.lap=lap;beep(660,0.2);if(lap<=G.laps)showMsg('LAP '+lap+'/'+G.laps),setTimeout(hideMsg,900);}
  // --- AI ---
  for(const c of cars){
    if(c.finished) continue;
    const cseg=findSegment(c.z+PLAYER_Z);
    const behind=(P.totalZ-c.totalZ)>0;
    const rubber=behind?1.05:0.96;
    const target=c.top*rubber*(0.97+0.03*Math.sin(G.raceTime*0.7+c.z));
    c.speed+=(target-c.speed)*Math.min(1,dt*1.5);
    const wantLine=clamp(-cseg.curve*0.32,-0.75,0.75);
    c.prevOffset=c.offset;
    c.offset+=(wantLine-c.offset)*Math.min(1,dt*1.2);
    c.lean=(c.offset-c.prevOffset)*8 - cseg.curve*0.12;
    c.z+=c.speed*dt; c.totalZ+=c.speed*dt;
    c.lap=Math.floor(c.totalZ/trackLength)+1;
    if(c.lap>G.laps){c.finished=true;}
  }
  // --- collisions ---
  for(const c of cars){
    const dz=Math.abs(((c.z-P.z+trackLength*1.5)%trackLength)-trackLength*0.5);
    if(dz<1300&&Math.abs(c.offset-P.x)<0.42){
      P.speed*=0.94;
      P.x+= (P.x<c.offset?-1:1)*dt*3;
      if(!P.bumpT||G.raceTime-P.bumpT>0.8){P.bumpT=G.raceTime;beep(140,0.12);}
    }
  }
  // --- finish ---
  if(P.lap>G.laps&&!P.finished){
    P.finished=true; P.finishTime=G.raceTime;
    finishRace();
  }
  engineSound(true,sp);
  updateHUD();
}

function playerRank(){
  const my=P.totalZ;
  let r=1;
  for(const c of cars) if(c.totalZ>my) r++;
  return r;
}
const ORD=['1st','2nd','3rd','4th','5th'];
function updateHUD(){
  document.getElementById('hudLap').textContent='LAP '+Math.min(P.lap,G.laps)+'/'+G.laps;
  document.getElementById('hudPos').textContent=ORD[playerRank()-1]||'5th';
  document.getElementById('hudSpeed').textContent=Math.round(P.speed/MAXS*228)+' MPH';
  document.getElementById('boostFill').style.width=(P.boost*100)+'%';
}

function finishRace(){
  G.mode='finish';
  engineSound(false,0);
  document.getElementById('touchUI').style.display='none';
  // standings by progress
  const all=[{name:G.racer.name+' (YOU)',you:true,total:P.totalZ,time:P.finishTime},
    ...cars.map(c=>({name:c.name,total:c.totalZ,time:c.finished?G.raceTime:null}))];
  all.sort((a,b)=>b.total-a.total);
  G.standings=all;
  const rank=all.findIndex(s=>s.you)+1;
  document.getElementById('resTitle').textContent=
    rank===1?'🏆 YOU WIN!':('FINISHED '+ORD[rank-1].toUpperCase());
  const t=document.getElementById('resTable'); t.innerHTML='';
  all.forEach((s,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="pos">${ORD[i]}</td><td>${s.name}</td><td>${s.time!=null?fmtTime(s.time):'—'}</td>`;
    t.appendChild(tr);
  });
  setTimeout(()=>{showScreen('resultScreen');},1200);
  showMsg(rank===1?'🏆':'FINISH!');
  setTimeout(hideMsg,1200);
}
function fmtTime(s){const m=Math.floor(s/60),ss=(s%60);return m+':'+ss.toFixed(2).padStart(5,'0');}

/* ---------- render ---------- */
let T=0;
function drawPlayer(){
  const set=SPR[P.id]; if(!set) return;
  const dir=P.steer<0?'left':(P.steer>0?'right':'straight');
  const img=set[dir]||set.straight;
  const wpx=Math.min(W*0.34,360);
  const hpx=wpx*img.height/img.width;
  const bounce=Math.sin(T*22)*(P.speed/MAXS)*3;
  const px=W/2+P.steer*26, py=H-24+bounce;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(px,py+6,wpx*0.36,14,0,0,7); ctx.fill();
  ctx.drawImage(img,px-wpx/2,py-hpx,wpx,hpx);
}
function frame(dt){
  T+=dt;
  if(G.mode==='race'||G.mode==='countdown'){
    if(G.mode==='race') update(dt); else update(dt);
    renderWorld(P,cars.filter(c=>{
      const rel=(c.z-P.z+trackLength)%trackLength;
      return rel>300&&rel<DRAW_DIST*SEG_LEN;
    }));
    if(G.mode==='race'||G.mode==='countdown') drawPlayer();
  }else if(G.mode==='menu'||G.mode==='title'){
    // idle attract: slow scroll
    renderBackground(null,0);
    ctx.fillStyle='#14141f'; ctx.fillRect(0,H*0.42,W,H);
  }
  requestAnimationFrame(loop);
}
let last=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
  frame(dt);
}

/* ---------- screens & menu ---------- */
function showScreen(id){
  for(const s of ['titleScreen','menuScreen','resultScreen']) document.getElementById(s).classList.add('hidden');
  if(id) document.getElementById(id).classList.remove('hidden');
  if(id!=='resultScreen'&&G.mode!=='race'&&G.mode!=='countdown'){
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('boostWrap').classList.add('hidden');
  }
}
function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.classList.remove('hidden');}
function hideMsg(){document.getElementById('msg').classList.add('hidden');}

function buildMenu(){
  const grid=document.getElementById('racerGrid'); grid.innerHTML='';
  RACERS.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='racerCard'+(i===0?' sel':'');
    const img=document.createElement('img');
    img.src='./assets/'+r.id+'-straight.png'; img.alt=r.name;
    d.appendChild(img);
    d.insertAdjacentHTML('beforeend',`<div class="nm">${r.name}</div><div class="cr">${r.car}</div>`);
    d.onclick=()=>{G.racer=r;document.querySelectorAll('.racerCard').forEach(c=>c.classList.remove('sel'));d.classList.add('sel');beep(520,0.08);};
    grid.appendChild(d);
  });
  document.querySelectorAll('.lapBtn').forEach(b=>{
    b.onclick=()=>{document.querySelectorAll('.lapBtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.laps=+b.dataset.laps;beep(520,0.08);};
  });
}
function startFromTitle(){
  audioInit(); showScreen(null);
  document.getElementById('btnTitle').textContent='LOADING…';
  loadAssets().then(()=>{
    buildMenu(); G.mode='menu'; showScreen('menuScreen'); hideMsg();
    document.getElementById('btnTitle').textContent='START ENGINE';
    requestAnimationFrame(loop);
  });
}
function startRace(){ audioInit(); beep(660,0.15); newRace(); requestAnimationFrame(loop); }

document.getElementById('btnTitle').onclick=startFromTitle;
document.getElementById('btnRace').onclick=startRace;
document.getElementById('btnAgain').onclick=()=>{showScreen(null);newRace();};
document.getElementById('btnChange').onclick=()=>{G.mode='menu';showScreen('menuScreen');};

function fit(){
  const ar=16/9; let w=innerWidth,h=innerHeight;
  if(w/h>ar) w=h*ar; else h=w/ar;
  cv.style.width=w+'px'; cv.style.height=h+'px';
}
addEventListener('resize',fit); fit();
renderBackground(null,0);
ctx.fillStyle='#14141f'; ctx.fillRect(0,H*0.42,W,H);
</script>
